name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blend-planner-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Verify Supabase project in bundle
        shell: bash
        run: |
          set -euo pipefail
          grep -R --fixed-strings "iefjhifomettmfkxidsq.supabase.co" dist >/dev/null
          if grep -R --fixed-strings "lmmgaeeoyukfbihoajxi.supabase.co" dist >/dev/null; then
            echo "Retired Supabase project found in production bundle."
            exit 1
          fi

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
